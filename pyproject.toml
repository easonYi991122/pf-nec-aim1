[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pf-nec-aim1"
version = "0.1.0"
description = "Code-only final-model research handoff"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pf_nec = ["spec_v1.json"]
"pf_nec.legacy" = ["v26_features.json"]
